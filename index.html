<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulario Registro</h1>
    <form action="/formulario/enviar">
        <label for="nombre">Nombre:</label><br>
        <input type="text"  name="nombre"><br><br>

        <label for="apellido">apellido:</label><br>
        <input type="text"  name="apellido"><br><br>

        <label for="fecha">fecha:</label><br>
        <input type="date"  name="fecha"><br><br>

        <label for="tipo_produccion">tipo producción:</label><br>
        <select name="tipo_produccion" >
            <option value="fabricacion">Fabricación:</option>
            <option value="produccion">Reparación</option>

        </select><br><br>


        
        
        <label for="produccion">Cantidad produción:</label><br>
        <input type="number"  name="produccion"><br><br>

        <select name="turno" >
            <option value="mañana">Turno mañana</option>
            <option value="noche">Turno noche</option>

        </select><br><br>

        <button type="submit">enviar</button>
</body>
</html>
